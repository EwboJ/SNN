# =============================================================================
# robot_v1：与真实录制行为一致的实机部署配置
# =============================================================================
# 说明：
# - 这是与真实录制行为一致的 robot_v1 实机部署配置
# - 重点是先实现可运行的低速闭环原型
# - 不是追求最优，而是先贴近真实车速和角速度
#
# 用途:
# - replay 离线复现
# - ROS2 在线节点

system:
  image_h: 48              # 输入图像高度, 与训练 img_h 对齐
  image_w: 64              # 输入图像宽度, 与训练 img_w 对齐
  control_rate_hz: 10      # 控制命令可10Hz发布, 推理与状态更新可低频缓存

models:
  junction_lr_ckpt: "checkpoint/corridor_task/raw_data/corridor_task_junction_lr_APLIF_ADD_T4/best_model.ckpt"      # 左右判定模型
  stage3_ckpt: "checkpoint/corridor_task/corridor_task_stage3a_APLIF_ADD_T4/best_model.ckpt"                # 三阶段模型
  straight_keep_ckpt: "checkpoint/corridor/corridor_regression_dim1_rate_APLIF_ADD_T4_seq4/best_model.ckpt"            # 直行纠偏回归模型
  approach_trigger_ckpt: "checkpoint/corridor_task/approach_trigger_sameenv_shortwin/best_model.ckpt"       # APPROACH 触发二分类模型

state_machine:
  boot_steps: 6                       # 启动预热步数, 抑制首帧抖动
  stage_window_size: 7                # stage3 多帧投票窗口大小
  stage_enter_turn_votes: 5           # 进入 Turn 所需最少票数
  stage_exit_turn_votes: 5            # 退出 Turn 所需最少票数
  junction_window_size: 5             # junction 左右投票窗口大小
  junction_lock_votes: 4              # 锁定 Left/Right 所需最少票数
  recover_min_steps: 4                # Recover 最少保持步数(按5Hz节奏下调)
  recover_blend_steps: 12             # Recover 到直行阶段的融合步数
  straightkeep_suppress_in_turn: true # Turn 期间抑制 straight_keep 输出

  # ----- TURN 退出增强（5Hz节奏）-----
  min_turn_steps: 5                   # TURN 最小持续步数
  soft_exit_min_turn_steps: 6         # 软退出最小步数
  max_turn_steps: 10                  # TURN 在状态机中的最大持续步数
  recover_support_steps_needed: 2     # Recover 信号累计确认所需有效支持步数(渐减模式)
  turn_exit_vote_threshold: 3         # turn_votes 低于此值时, 配合低 omega 可退出 TURN
  straight_recover_omega_thresh: 0.12 # TURN 退出条件: |omega_raw| 低于此值视为可安全切回直行
  straight_recover_hold_steps: 3      # 低 turn + 低 omega 需持续的步数才可退出 TURN
  recover_recenter_omega_thresh: 0.15 # RECOVER 回到 STRAIGHTKEEP 前的回正阈值
  recover_recenter_hold_steps: 2      # RECOVER 回正阈值需持续满足步数

  # ----- STRAIGHTKEEP -> APPROACH 事件触发门控 -----
  straightkeep_min_steps_before_approach: 8       # STRAIGHTKEEP 保持最小步数后才允许触发 APPROACH
  approach_arm_turn_votes: 3                      # arm 条件要求的最小 turn 票数
  approach_arm_consecutive_steps: 2               # arm 条件需连续满足步数
  approach_arm_use_junction_hint: true            # 是否要求 junction hint 一致性
  approach_arm_junction_consistency_steps: 2      # junction hint 连续一致步数

  # ----- Junction 锁存延迟 -----
  min_approach_steps_before_junction_lock: 4      # APPROACH 中 junction 最早锁存步数门槛
  min_turn_votes_before_junction_lock: 3          # junction 锁存需要的最低 turn 票数
  start_junction_hist_on_turn_signal: true        # 出现 turn 信号后才累计 junction 历史
  min_turn_votes_to_start_junction_hist: 3        # 启动 junction 历史累计所需最小 turn 票数
  reset_junction_hist_when_no_turn_signal: true   # APPROACH 且长期无 turn 信号时重置 junction 历史
  allow_turn_relock_once: false                   # TURN 期间禁用中途反向重锁

  # ----- PROVISIONAL_TURN 提交确认 -----
  provisional_turn_window_steps: 6                # PROVISIONAL_TURN 最长观察窗口步数
  provisional_turn_commit_votes: 4                # 兼容旧规则: 窗口内达到该票数可作为候选基础
  provisional_turn_mix_ratio: 0.35                # PROVISIONAL_TURN 控制混合比例
  provisional_turn_min_observe_steps: 3           # 最小观察步数, 未达到前禁止提交
  provisional_turn_recent_consistency_steps: 3    # 最近连续一致步数阈值
  provisional_turn_margin_votes: 2                # 主方向相对次方向的最小领先票数
  provisional_turn_use_omega_gate: true           # 是否启用 omega 方向一致性门控
  provisional_turn_omega_sign_thresh: 0.12        # omega 符号判定阈值
  provisional_turn_require_omega_agreement: false # 提交方向不强制要求与 omega 方向一致

turn_control:
  left_omega: 0.5             # 固定左转角速度(rad/s)
  right_omega: -0.5           # 固定右转角速度(rad/s)
  use_fixed_turn_rate: true   # Turn 阶段使用固定角速度
  max_turn_steps: 10          # Turn 最长持续步数, 对齐1~2秒真实转弯

straight_keep:
  omega_clip: 0.25            # 纠偏角速度裁剪阈值
  use_clip: true              # 是否启用裁剪

scheduler:
  policy: state_conditioned_v2
  reuse_last_outputs: true
  stage3_probe_stride: 3
  junction_probe_stride: 1
  straight_keep_stride: 1
  trigger_stride: 1
  disable_junction_after_lock: true
  turn_stage3_stride: 2
  recover_stage3_stride: 2

robot_control:
  cmd_publish_hz: 10
  use_state_based_linear_speed: true
  linear_speed_boot: 0.0
  linear_speed_straightkeep: 0.30
  linear_speed_approach: 0.25
  linear_speed_provisional_turn: 0.22
  linear_speed_turn: 0.20
  linear_speed_recover: 0.25
  angular_clip: 0.25
  publish_last_cmd_when_no_new_inference: true

safety:
  image_timeout_sec: 1.0
  model_output_timeout_sec: 1.0
  publish_zero_on_timeout: true
  publish_zero_on_missing_image: true
  max_consecutive_errors: 5
  stop_on_exception: true

topics:
  image_topic: /camera/image_raw
  cmd_vel_topic: /cmd_vel
  debug_topic: /nav/debug
  state_topic: /nav/state

logging:
  save_debug_json: false      # 实机原型阶段关闭磁盘调试落盘
  save_csv: false             # 实机原型阶段关闭CSV落盘
  verbose: true               # 控制台打印详细日志
